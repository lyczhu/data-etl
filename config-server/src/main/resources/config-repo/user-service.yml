server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/etl_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  redis:
    host: localhost
    port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  # WP-06：生产必须通过环境变量 JWT_SECRET 注入；仓库不再硬编码生产密钥
  secret: ${JWT_SECRET:dataetl-dev-only-jwt-secret-change-in-production-0123456789}
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.lawyus.dataetl: DEBUG
    org.springframework.security: DEBUG
