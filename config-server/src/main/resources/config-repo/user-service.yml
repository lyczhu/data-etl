server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/etl_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  redis:
    host: localhost
    port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: dataetl-secret-key-for-jwt-token-generation-and-validation-must-be-at-least-256-bits
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.lawyus.dataetl: DEBUG
    org.springframework.security: DEBUG
