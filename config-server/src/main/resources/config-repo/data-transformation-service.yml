server:
  port: 8084

spring:
  application:
    name: data-transformation-service
  datasource:
    url: jdbc:postgresql://localhost:5433/etl_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      type: batch
    properties:
      client.dns.lookup: resolve_canonical_bootstrap_servers_only
    consumer:
      group-id: data-transformation-group
      auto-offset-reset: earliest
      max-poll-records: 100
    producer:
      properties:
        linger.ms: 10
        # 修复：原值 262,144 含千分位逗号，被 YAML 当字符串传给 Kafka batch.size(INT) →
        # 抛 ConfigException，转换服务每次发送失败，E→L 断链、任务永不完成。
        batch.size: 262144   # 256KB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

etl:
  topics:
    data-extraction: raw-data
    data-transformation: transformed-data

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
