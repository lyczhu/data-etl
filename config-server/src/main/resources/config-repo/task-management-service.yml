server:
  port: 8082

spring:
  application:
    name: task-management-service
  datasource:
    url: jdbc:postgresql://localhost:5433/etl_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Phase 2B：db/schema 是唯一真源；Hibernate 不再改表，启动时只校验实体与表一致
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: localhost
    port: 6379
    # 本地/编排 Redis 未设 requirepass；空 password 会被 Redisson 当作 AUTH 口令导致启动失败，故不定义该属性
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      client.dns.lookup: resolve_canonical_bootstrap_servers_only
    consumer:
      group-id: task-management-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

data:
  source:
    service:
      url: http://localhost:8081

etl:
  topics:
    task-request: task-request
    task-completed: task-completed
    task-failed: task-failed
    # 目标态新 topic（控制面，§5.1）；DispatchService / Progress·Results·Dlt 监听在 Worker/SPI 接线切片接入
    dispatch-batch: etl.task.dispatch.batch
    progress: etl.task.progress
    results: etl.task.results
    dlt: etl.task.dlt
    commands: etl.task.commands
  # 编排器状态机退避/超时阈值（orchestrator-design.md §7.8）；被四个 sweeper 读取
  orchestrator:
    max-attempts: 3
    dispatch-heartbeat-timeout: 60s
    cancel-ack-timeout: 90s
    scheduled-starvation-timeout: 5m
    throttled-starvation-timeout: 30m
    partial-success-retention: 24h
    needs-attention-escalation: 7d
    created-timeout: 5s
    validated-timeout: 10s
    stall-fallback-threshold: 30m
    backoff-task-attempts: [5m, 15m, 1h]
  # Phase 2B：状态迁移审计保留策略（INV-9）
  audit:
    retention-days: 180
    retention-cron: "0 0 3 * * *"
  # Phase 2C：派工 Outbox；false = 直投 Kafka（回滚开关）
  outbox:
    enabled: false
    poll-interval-ms: 1000
    batch-size: 200
    max-attempts: 5
    backoff-seconds: [1, 5, 30, 120, 600]
    retention-days: 7
  # Phase 2D：每日对账（近 48h 终态 run）
  reconciliation:
    enabled: true
    cron: "0 30 2 * * *"
    lookback-hours: 48
    batch-size: 100
    query-timeout-seconds: 30
  # 派工与背压（§5.4 / §7.2）；令牌桶容量 = max-concurrent-shards
  dispatch:
    pump-batch: 50
    permits-per-run: 8
    max-concurrent-shards: 24
    shard-max-total: 5000
    shard-chunk-size: 5000
    shard-target-count: 16
  # 新旧链路灰度路由（§11.2/§11.4）
  routing:
    new-worker: true
    shadow-compare: true
    # Phase 1C 收口（2026-10-21）：S1/S2/S3 接入测试全过，白名单清空 = 全部 dataSource 走新链路；
    # 回滚只需 new-worker=false（旧链路恢复独占）。
    data-source-whitelist: []

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
