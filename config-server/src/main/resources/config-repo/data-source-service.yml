server:
  port: 8081

spring:
  application:
    name: data-source-service
  datasource:
    url: jdbc:postgresql://localhost:5433/etl_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

etl:
  security:
    # WP-06：数据源口令 AES/GCM 密钥；生产必须通过环境变量 ETL_SECRET_KEY 注入，禁止使用仓库默认值
    secret-key: ${ETL_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
