server:
  port: 8050

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo
        default-label: main
        monitor:
          file:
            enabled: true
            monitor-path: classpath:/config-repo/*

#    bus:
#      enabled: true   # 开启消息总线，默认为true
#      refresh:
#        enabled: true
      # destination: custom-topic # (可选) 指定Kafka主题，默认为"springCloudBus"

  profiles:
    active: native
  security:
    user:
      name: config
      password: config123

  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh,busrefresh,monitor
  endpoint:
    health:
      show-details: always
