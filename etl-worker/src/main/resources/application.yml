spring:
  application:
    name: etl-worker
  config:
    import: optional:configserver:http://localhost:8050
  profiles:
    active: batch          # batch=分片批处理；stream=常驻流消费（Phase 3）
  datasource:
    url: jdbc:postgresql://localhost:5433/etl_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: etl-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 一条 dispatch = 一个 shard；一次只取一条，避免长分片阻塞 poll。
      max-poll-records: 1
      properties:
        # 长分片仍在同一 listener 线程执行；先放宽到 30m，Phase 1A 再切异步 + pause/resume。
        max.poll.interval.ms: 1800000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        linger.ms: 10
        batch.size: 262144
        compression.type: zstd
    listener:
      # 3 个并发消费者可同时处理 3 个 shard；同一 shard 的重复投递由 checkpoint/幂等兜底。
      concurrency: 3
      ack-mode: record

server:
  # user-service 占用 8086；worker 改用 8087。
  port: 8087

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

data:
  source:
    service:
      # WP-06：worker 用 dataSourceId 向 data-source-service 换取运行时连接信息，消息面不再带明文口令
      url: http://localhost:8081

etl:
  topics:
    dispatch-batch: etl.task.dispatch.batch
    progress: etl.task.progress
    results: etl.task.results
    dlt: etl.task.dlt
  worker:
    chunk-size: 5000
    fetch-size: 5000
    max-shards: 5000
    progress-interval-ms: 5000
    transform-profile: JDBC   # JDBC|CSV|JSON|MONGO|GEOJSON；决定默认转换规则链
    # WP-07：<0 = 不做默认数值截断；任务显式配置精度时才启用
    number-scale: -1
    keep-columns: []          # 非空则前置字段裁剪 + snake_case 归一
    # WP-05：分片内瞬态错误重试与退避
    shard-max-retries: 3
    retry-backoff-ms: 1000
    # WP-02：同库部署时目标写入 + checkpoint + DLT 同事务；跨库自动退化为幂等重放
    same-database-transaction: true
    lease-seconds: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,refresh
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
