# Data Storage Service JVM 参数配置文件
# 可根据服务器环境调整参数

# 服务名称
SERVICE_NAME=data-storage-service

# JVM 内存设置
JAVA_HEAP_MIN=512m
JAVA_HEAP_MAX=512m
JAVA_METASPACE_MIN=128m
JAVA_METASPACE_MAX=256m

# JVM GC 设置
JAVA_GC_TYPE=G1GC
JAVA_GC_LOG_OPTS=-Xlog:gc*:file=logs/gc.log:time,uptime,level,tags:filecount=5,filesize=10m

# JVM 其他参数
JAVA_OPTS=-server -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai

# Spring Boot 参数
# SPRING_OPTS=--spring.profiles.active=prod

# 服务端口
SERVER_PORT=8085

# JMX 监控（可选）
JMX_OPTS=-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=18085 -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.authenticate=false
