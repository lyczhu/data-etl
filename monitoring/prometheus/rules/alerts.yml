groups:
  - name: etl-instance-alerts
    rules:
      - alert: InstanceDown
        expr: up{job="spring-actuator"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "Target {{ $labels.instance }} for job={{ $labels.job }} is down (no scraping)"

      - alert: ServiceDown
        expr: up{job="spring-actuator"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Spring service down"
          description: "One or more spring-actuator targets are not responding for more than 2 minutes."

  - name: etl-node-exporter-alerts
    rules:
      - alert: NodeHighCPU
        expr: 1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage > 80% for 2 minutes on {{ $labels.instance }}"

      - alert: NodeHighDiskUsage
        expr: (node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage > 85% for more than 5 minutes on {{ $labels.instance }}"

  # Phase 0 可观测性：仅对当前已真实产出的指标告警（storage etl.* 埋点 + JVM + Kafka lag）。
  # NEEDS_ATTENTION / DLT 类规则依赖 Phase 1 的 orchestrator 指标，届时再启用。
  - name: etl-pipeline-alerts
    rules:
      - alert: JvmFullGcStorm
        expr: rate(jvm_gc_pause_seconds_count{action="end of major GC"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Full GC storm on {{ $labels.application }}/{{ $labels.instance }}"
          description: "Major (>Full) GC rate > 0.1/s for 5m; 疑似堆不足或内存泄漏（见 performance-analysis.md §2）。"

      - alert: EtlLoadSlowRegression
        expr: histogram_quantile(0.95, sum(rate(etl_load_duration_seconds_bucket[5m])) by (le)) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ETL load P95 latency regression"
          description: "单批次入库 P95 耗时 > 5s 持续 10m。"

      - alert: EtlRecordsDroppedGrowing
        expr: increase(etl_records_dropped_total[10m]) > 20
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "ETL dropping many malformed records"
          description: "10m 内因消息非法被丢弃 > 20 条；需排查上游数据/契约（Phase 1 将转 DLT）。"

      - alert: EtlInsertRetryHigh
        expr: increase(etl_insert_retry_total[5m]) > 30
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "ETL insert retries elevated"
          description: "5m 内批量插入重试 > 30 次；目标库可能过载或存在约束冲突。"

      - alert: EtlConsumerLagHigh
        expr: kafka_consumer_fetch_manager_records_lag_max{client_id=~".*"} > 5000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag high on {{ $labels.client_id }}"
          description: "消费 lag > 5000 持续 10m；存在背压/吞吐瓶颈。"

  # Phase 1B 控制面告警（WP-15 / Gate 2）：指标由 RunStateMetrics + OrchestratorMetrics 产出。
  - name: etl-orchestrator-alerts
    rules:
      - alert: EtlRunNeedsAttention
        expr: sum(etl_run_state_count{state="NEEDS_ATTENTION"}) > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "ETL run 需要人工介入"
          description: "存在 NEEDS_ATTENTION run 超过 10m；查 /api/tasks/{taskId}/failures 与 /progress。"

      - alert: EtlDltUnresolved
        expr: max(etl_dlt_unresolved_size) > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "未解决 DLT 行堆积"
          description: "etl_task_dlt 存在未解决行超过 10m；修复数据后重试，勿直接改状态。"

      - alert: EtlCheckpointLagHigh
        expr: max(etl_checkpoint_lag_seconds) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "checkpoint 写入停滞"
          description: "全局 checkpoint 最近写入距今 > 300s；worker 可能停摆或 lease 被占。"

  # Phase 2 治理面告警：审计 / Outbox / 对账 / 目标表。
  - name: etl-phase2-governance-alerts
    rules:
      - alert: EtlAuditWriteFailures
        expr: increase(etl_audit_write_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "状态迁移审计写入失败"
          description: "审计与状态写同事务，失败意味着迁移已回滚；查 task-management 日志与 DB 可用性。"

      - alert: EtlOutboxBacklogStuck
        expr: max(etl_outbox_oldest_pending_age_seconds) > 300
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Outbox 最老待投递行超过 5 分钟"
          description: "poller 可能停止/拿不到锁/Kafka 不可用；查 etl_outbox 与 OutboxPoller 日志。"

      - alert: EtlOutboxSendFailures
        expr: increase(etl_outbox_send_failures_total[10m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Outbox 投递失败升高"
          description: "10m 内失败 > 5 次；检查 Kafka 与 last_error，必要时回滚 etl.outbox.enabled=false。"

      - alert: EtlOutboxPendingHigh
        expr: max(etl_outbox_pending) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Outbox 待投递积压"
          description: "待投递行 > 1000 持续 10m；检查 poller 吞吐与 Kafka 分区。"

      - alert: EtlReconciliationMismatch
        expr: increase(etl_reconciliation_evaluations_total{result="MISMATCH"}[1d]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "对账发现不一致"
          description: "查 GET /api/reconciliation/{runId}；不要直接改状态，先确认源/目标/幂等键。"

      - alert: EtlReconciliationError
        expr: increase(etl_reconciliation_evaluations_total{result="ERROR"}[1d]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "对账执行失败"
          description: "外部库连接/表缺失等；查 reconciliation details 与数据源配置。"

      - alert: EtlTargetTableOrphaned
        expr: max(etl_target_table_count{state="ORPHANED"}) > 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "存在待清理孤儿目标表"
          description: "先 dry-run：POST /api/admin/target-tables/cleanup?dryRun=true，确认后再 false。"

